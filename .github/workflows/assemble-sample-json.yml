name: assemble-sample-json
on:
  push:
    paths:
      - 'reports/_assemble/**'
      - '.github/workflows/assemble-sample-json.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode compact reports onto canonical paths
        run: python3 reports/_assemble/assemble.py
      - name: Commit assembled JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/sample_psv_eindhoven_live.json reports/sample_barcelona_demo.json
          git diff --cached --stat
          git commit -m "Assemble full sample JSON reports from compact payloads" || echo "no changes"
          git push
